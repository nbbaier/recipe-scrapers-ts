name: CI Pipeline

on:
   pull_request:
   push:
      branches:
         - main

jobs:
   type-check:
      name: type-check
      runs-on: ubuntu-latest
      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Setup Bun
           uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.3.13

         - name: Install dependencies
           run: bun install --frozen-lockfile

         - name: Type check
           run: bun run type-check

   check:
      name: check
      runs-on: ubuntu-latest
      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Setup Bun
           uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.3.13

         - name: Install dependencies
           run: bun install --frozen-lockfile

         - name: Check
           run: bun run check

   test:
      name: test
      runs-on: ubuntu-latest
      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Setup Bun
           uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.3.13

         - name: Install dependencies
           run: bun install --frozen-lockfile

         - name: Sync test data
           run: bun run sync-test-data

         - name: Test
           run: bun test
